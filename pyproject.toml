[project]
name = "rf-agent"
version = "0.1.0"
description = "RF AI Agent MVP（三人团队，14 天手册）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162,<0.163",
    "nicegui==4.0.0",
    "plotly>=7.1,<8",
    "pydantic>=2.5",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
